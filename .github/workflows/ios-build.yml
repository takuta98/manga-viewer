name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version && ls /Applications | grep -i xcode

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build for iOS Simulator
        working-directory: MangaViewer
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MangaViewer.xcodeproj \
            -scheme MangaViewer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Unit tests
        working-directory: MangaViewer
        run: |
          set -euo pipefail
          DEST=$(xcodebuild -project MangaViewer.xcodeproj -scheme MangaViewer -showdestinations \
            | sed -n 's/.*platform:iOS Simulator.*id:\([^,]*\).*name:iPhone.*/\1/p' \
            | head -1 || true)
          if [ -z "${DEST}" ]; then
            echo "No iPhone simulator; skipping tests"
            exit 0
          fi
          xcodebuild test \
            -project MangaViewer.xcodeproj \
            -scheme MangaViewer \
            -destination "platform=iOS Simulator,id=${DEST}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
