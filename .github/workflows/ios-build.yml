name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version && ls /Applications | grep -i xcode

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Quality gate
        run: python3 scripts/quality-gate.py

      - name: Build for iOS Simulator
        working-directory: MangaViewer
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MangaViewer.xcodeproj \
            -scheme MangaViewer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
